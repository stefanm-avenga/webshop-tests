# .qe-projects.yaml — project registry for this repo
#
# Pure registry: for each project this repo hosts, where the project lives and
# where its instruction overlays and governance rules are. Nothing else — the
# per-ticket working scope is NOT defined here. @coordinator derives it at
# dispatch time (project tree filtered by ticket relevance: a UI ticket needs
# test assets + the app surface under test, not database or API internals) and
# writes it to .qe-active-scope.json, which the scope-enforcement hook
# enforces at runtime.
#
# A repo may host several projects (e.g. apps/projectX, apps/projectY), each
# with its own overlays. This repo hosts one: webshop spans the whole repo.

projects:
  webshop:
    path: .
    instructions: instructions/apps/webshop/
    governance: governance/patterns/apps/webshop/
